# Publishes the site/ folder (plus the two installer scripts) to GitHub Pages
# at https://feathers.owletrecords.com.
#
# INERT UNTIL PAGES IS ENABLED: until the repository's Settings > Pages source
# is set to "GitHub Actions", the deploy job has nothing to deploy to and fails;
# the build job only assembles an artifact. Nothing here enables Pages itself.
#
# install.sh and install.ps1 are copied from scripts/ at publish time, so
# scripts/ stays the single source of truth; do not add copies under site/.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/install.*'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp scripts/install.sh scripts/install.ps1 _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
